[package]
name = "isideload-apple-xar"
version = "0.20.4"
authors = ["Nicholas Sharp <nab@nabdev.me>"]
edition = "2021"
rust-version = "1.81"
license = "MPL-2.0"
description = "XAR archive reading and writing"
keywords = ["apple", "xar"]
homepage = "https://github.com/nab138/isideload-apple-platform-rs"
repository = "https://github.com/nab138/isideload-apple-platform-rs.git"
readme = "README.md"

[dependencies]
base64 = "0.22.1"
bcder = { version = "0.7.4", optional = true }
bzip2 = "0.6.1"
chrono = { version = "0.4.38", features = ["serde"] }
cryptographic-message-syntax = { version = "0.31.0", package = "isideload-cryptographic-message-syntax", optional = true}
digest = "0.10.7"
log = "0.4.22"
md-5 = "0.10.6"
flate2 = "1.0.35"
rand = { version = "0.8.5", optional = true }
scroll = { version = "0.12.0", features = ["derive"] }
serde-xml-rs = "0.6.0"
serde = { version = "1.0.215", features = ["derive"] }
sha1 = "0.10.6"
sha2 = "0.10.8"
signature = { version = "2.2.0", features = ["std"], optional = true }
thiserror = "2.0.3"
xml-rs = "0.8.23"
x509-certificate = { version = "0.26.0", package = "isideload-x509-certificate" }
liblzma = { version = "0.4.6", features = ["static"] }
isideload-vfs = { version = "0.0.1", path = "../isideload-vfs" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = [
  "js",
] }
getrandom_04 = { package = "getrandom", version = "0.4", default-features = false, features = [
  "wasm_js",
] }

[features]
default = ["signing"]
# Enable support for extracting the cryptographic signature in XAR archives.
signing = [
    "dep:bcder",
    "dep:cryptographic-message-syntax",
    "dep:rand",
    "dep:signature",
]
wasm = ["liblzma/wasm"]