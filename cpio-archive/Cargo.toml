[package]
name = "isideload-cpio-archive"
version = "0.10.0"
authors = ["Nicholas Sharp <nab@nabdev.me>"]
edition = "2021"
license = "MPL-2.0"
description = "cpio archive reading and writing"
keywords = ["cpio"]
homepage = "https://github.com/nab138/isideload-apple-platform-rs"
